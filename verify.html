<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Receipt — MMLI</title>
<meta name="description" content="Verify an MMLI payment receipt.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<style>
  .verify-shell{ max-width:560px; margin:0 auto; padding: 40px 16px 60px; }
  .verify-card{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md); padding: 30px 26px; text-align:center;
    animation: fadeSlideUp 420ms var(--ease) both;
  }
  .verify-icon{ font-size: 3rem; margin-bottom: 8px; }
  .verify-icon.valid{ animation: popIn 460ms var(--ease) both; }
  .verify-title{ font-family:var(--font-display); font-weight:800; font-size:1.3rem; margin-bottom:4px; }
  .verify-sub{ color:var(--text-muted); font-size:.9rem; margin-bottom:20px; }
  .verify-details{ text-align:left; background:var(--navy-050); border-radius:var(--radius-md); padding:16px 18px; }
  [data-theme="dark"] .verify-details{ background: var(--surface-raised); }
  .verify-row{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--border); font-size:.9rem; }
  .verify-row:last-child{ border-bottom:none; }
  .verify-row .k{ color:var(--text-muted); }
  .verify-row .v{ font-weight:700; font-family:var(--font-mono); text-align:right; }
  .verify-banner{
    display:inline-block; padding:6px 16px; border-radius:999px; font-weight:800; letter-spacing:.05em;
    font-size:.9rem; margin-bottom:14px;
  }
  .verify-banner.valid{ background:var(--success-bg); color:var(--success); }
  .verify-banner.invalid{ background:var(--danger-bg); color:var(--danger); }
  .verify-scope-note{
    margin-top:22px; text-align:left; font-size:.82rem; color:var(--text-muted);
    background: var(--info-bg); border-radius: var(--radius-sm); padding:12px 14px;
  }
  .verify-scope-note strong{ display:block; color:var(--text); margin-bottom:3px; }
  .back-link{ display:inline-block; margin-top:20px; font-size:.88rem; }
</style>
</head>
<body>

<header class="app-header" style="padding-bottom:22px;">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark"><img id="header-logo-img" src="" alt="MMLI logo"></div>
      <div class="brand-text">
        <div class="org-sub">MMLI</div>
        <h1 id="brand-name">Mind Masters Liberia Initiative</h1>
        <div class="motto">Receipt Verification</div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="verify-shell">
    <div class="verify-card" id="verify-card">
      <p>Checking receipt…</p>
    </div>
  </div>
</main>

<footer class="app-footer">MMLI Receipt Generator &middot; Local Verification</footer>

<script src="assets.js"></script>
<script src="verify.js"></script>
</body>
</html>
